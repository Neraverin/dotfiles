# Declarative machine configuration for provision.py. Every package, file and
# shell tweak a host needs has an entry here, sourced from the distribution or
# from upstream.
#
# `common` applies everywhere. `gui` is merged on top only on graphical hosts,
# either detected automatically or forced with --gui / --no-gui.
#
# Source sections, in the order provision.py applies them:
#   apt      third-party repositories, distribution packages, renamed-binary links
#   github   release assets: archives (`binaries:`) or raw executables (`binary:`)
#   archive  arbitrary tarballs unpacked under ~/.local/opt/<name>
#   npm      global npm packages under ~/.local
#   go       `go install` targets, built with the toolchain from `archive`
#   fonts    font archives unpacked under ~/.local/share/fonts/<name>
#   files    repository-owned dotfiles, rewritten on every run
#   seeds    dotfiles the application rewrites itself, created once
#   lines    single lines appended to a foreign config unless already present
#   shell    rendered into ~/.bashrc.d/50-dotfiles.sh
#
# `workstation` is separate from all of that: system-wide desktop software,
# applied only by ./workstation.sh. Its sources are `apt` (as above),
# `snap`, `deb` (a .deb from a GitHub release) and `script` (a vendor installer).
#
# Kept deliberately host-agnostic: nothing here may assume a graphical session,
# a specific distribution, or a path outside $HOME.

common:
  # Distribution packages. Anything Debian 12 — the oldest host — ships in a
  # usable version belongs here; the rest moves to `github`.
  apt:
    # Third-party repositories, written before anything is installed. `key`,
    # `uri` and `suites` take {id}, {codename} and {arch} from the host, so one
    # entry resolves to debian/bookworm on the WSL instance and ubuntu/resolute
    # on the workstation. A repository with no suite for the running release is
    # skipped with a warning rather than left to break every later apt-get
    # update.
    repos:
      docker:
        # Neither Debian nor Ubuntu ships the engine: docker.io is the old fork,
        # trails upstream by releases and carries no compose v2 plugin. Docker's
        # own repository is the only source for docker-ce and the plugins below.
        key: https://download.docker.com/linux/{id}/gpg
        uri: https://download.docker.com/linux/{id}
        components: stable

    packages:
      - bat
      - ca-certificates
      - containerd.io
      - curl
      - direnv
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
      - fd-find
      - fontconfig
      - fzf
      - git
      - glances
      - htop
      - jq
      - mc
      - net-tools
      - nodejs
      - npm
      - poppler-utils
      - python3-yaml
      - shellcheck
      - tree
      - unzip
      - vim
      - wget

    # Debian renames two binaries to dodge a name clash. Upstream scripts, and
    # the `cat = bat` alias below, expect the upstream names.
    links:
      batcat: bat
      fdfind: fd

  # Upstream release binaries, for tools the distributions keep too old.
  # `asset` accepts {version} (the tag verbatim) and {version_strip} (without a
  # leading v) because upstreams disagree about which one they put in filenames.
  github:
    golangci-lint:
      repo: golangci/golangci-lint
      asset: golangci-lint-{version_strip}-linux-amd64.tar.gz
      binaries: [golangci-lint]
    herdr:
      repo: ogulcancelik/herdr
      asset: herdr-linux-x86_64
      binary: herdr
    procs:
      repo: dalance/procs
      asset: procs-{version}-x86_64-linux.zip
      binaries: [procs]
    ripgrep:
      repo: BurntSushi/ripgrep
      asset: ripgrep-{version}-x86_64-unknown-linux-musl.tar.gz
      binaries: [rg]
    starship:
      repo: starship/starship
      asset: starship-x86_64-unknown-linux-gnu.tar.gz
      binaries: [starship]
    witr:
      repo: pranshuparmar/witr
      asset: witr-linux-amd64
      binary: witr
    yq:
      repo: mikefarah/yq
      asset: yq_linux_amd64
      binary: yq
    zoxide:
      repo: ajeetdsouza/zoxide
      asset: zoxide-{version_strip}-x86_64-unknown-linux-musl.tar.gz
      binaries: [zoxide]

  # Tarballs that are not GitHub releases. Unpacked whole under
  # ~/.local/opt/<name>; `bin` is symlinked from ~/.local/bin.
  archive:
    go:
      # Debian 12 ships Go 1.19, far behind what the modules here need, and the
      # toolchain is one self-contained tree — upstream's tarball is simplest.
      url: https://go.dev/dl/{version}.linux-amd64.tar.gz
      version_url: https://go.dev/VERSION?m=text
      strip: 1
      bin: [go, gofmt]

  # Global npm packages, installed under ~/.local so no root is involved.
  npm:
    - "@anthropic-ai/claude-code"
    - "@fission-ai/openspec"
    - "@openai/codex"

  # Built from source with the Go toolchain above, into ~/.local/bin.
  go:
    gopls: golang.org/x/tools/gopls@latest

  # Files this repository owns: rewritten on every run.
  files:
    ~/.config/starship.toml: files/starship/starship.toml

  # Files an application rewrites itself: created once, then left alone.
  seeds:
    ~/.codex/config.toml: files/codex/config.toml
    ~/.claude/settings.json: files/claude/settings.json
    ~/.claude/statusline-command.sh:
      source: files/claude/statusline-command.sh
      mode: 0755

  # Rendered into ~/.bashrc.d/50-dotfiles.sh, which ~/.bashrc is taught to
  # source. The distribution's own ~/.bashrc is never replaced.
  shell:
    env:
      EDITOR: vim
    path:
      - $HOME/.local/bin
    aliases:
      cat: bat
      grep: rg
      ll: ls -alF
      ls: ls --color=auto
    init:
      - direnv hook bash
      - starship init bash
      - zoxide init bash
    # Raw lines, for what an `eval "$(...)"` cannot express. fzf only grew
    # `--bash` in 0.48; Debian 12 still ships 0.38 with the examples directory.
    snippets:
      - 'if command -v fzf >/dev/null 2>&1; then'
      - '  if fzf --bash >/dev/null 2>&1; then'
      - '    eval "$(fzf --bash)"'
      - '  elif [ -f /usr/share/doc/fzf/examples/key-bindings.bash ]; then'
      - '    . /usr/share/doc/fzf/examples/key-bindings.bash'
      - '  fi'
      - 'fi'

gui:
  archive:
    deadbeef:
      # Not in the Ubuntu 26.04 archive and with no GitHub release; upstream's
      # static build is the only packaging that still installs cleanly.
      url: https://sourceforge.net/projects/deadbeef/files/travis/linux/{version}/deadbeef-static_{version}-1_x86_64.tar.bz2/download
      version: 1.10.0
      archive_name: deadbeef-static_{version}-1_x86_64.tar.bz2
      strip: 1
      bin: [deadbeef]
      # The static build ships the binary and its data, no packaging metadata,
      # so the launcher is generated rather than patched.
      desktop:
        name: DeaDBeeF
        exec: deadbeef
        icon: deadbeef.png
        comment: Audio player
        categories: AudioVideo;Audio;Player;
        mimetype: audio/mpeg;audio/flac;audio/ogg;audio/x-vorbis+ogg;audio/x-wav;

  fonts:
    hack-nerd-font:
      repo: ryanoasis/nerd-fonts
      asset: Hack.zip

  files:
    ~/.config/wezterm/wezterm.lua: files/wezterm/wezterm.lua

  # DeaDBeeF's ALSA output cannot reach Ubuntu's PipeWire bridge; its PulseAudio
  # output talks to the pipewire-pulse socket directly. Appended only when the
  # key is unset, so a plugin picked in the GUI survives later runs.
  lines:
    ~/.config/deadbeef/config:
      - match: '^output_plugin '
        line: output_plugin pulseaudio

# System-wide desktop software for the Ubuntu workstation. Reached only through
# ./workstation.sh, which is `provision.py --workstation`; an ordinary
# run never declares any of this, so it is kept out of `gui` and given its own
# state bucket — otherwise every ./apply.sh would read the silence as an
# instruction to uninstall it all.
workstation:
  apt:
    repos:
      wezterm:
        # No wezterm in the Ubuntu archive at all, and this host follows the
        # nightly channel, so upstream's own repository is the only source.
        key: https://apt.fury.io/wez/gpg.key
        uri: https://apt.fury.io/wez/
        # Fury serves one flat tree: there is no suite or component to name.
        suites: "*"
        components: "*"
      claude-desktop:
        # Anthropic publishes one suite for every distribution, so the usual
        # {codename} template does not apply here.
        key: https://downloads.claude.ai/claude-desktop/key.asc
        fingerprint: 31DDDE24DDFAB679F42D7BD2BAA929FF1A7ECACE
        uri: https://downloads.claude.ai/claude-desktop/apt/stable
        suites: stable
        files:
          # The package's postinst registers this repository a second time as a
          # one-line .list, and apt then warns about the duplicate on every
          # update. It reads this file and skips its own registration.
          /etc/default/claude-desktop: |
            CLAUDE_DESKTOP_ADD_REPO="false"
    packages:
      - claude-desktop
      - wezterm-nightly

  # Snaps. Only where the deb world has nothing current to offer.
  snap:
    - telegram-desktop

  # A .deb published on a GitHub release and nowhere else.
  deb:
    happ:
      repo: Happ-proxy/happ-desktop
      asset: Happ.linux.{arch}.deb
      # Upstream labels its assets by its own architecture names.
      arch:
        amd64: x64
        arm64: arm64

  # Upstreams whose only supported install is a script they host.
  script:
    tailscale:
      # The installer resolves the right repository for the running
      # distribution and release, which is less to keep current here than one
      # repos: entry per host.
      url: https://tailscale.com/install.sh
      post:
        - [sudo, tailscale, set, "--operator={user}"]
        - [tailscale, configure, systray, "--enable-startup=systemd"]
        - [systemctl, --user, daemon-reload]
        - [systemctl, --user, enable, --now, tailscale-systray]
